server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # O roteamento e do navegador: qualquer caminho desconhecido devolve o index
    # para o React Router resolver. Sem isto, recarregar /orders/7 daria 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # O bundle tem hash no nome, entao pode ficar em cache por muito tempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O index nao: e ele que aponta para o bundle novo depois de um deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
