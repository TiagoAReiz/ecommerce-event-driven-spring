services:

  broker:
    image: apache/kafka:3.9.2
    container_name: broker
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    ports:
      - 29092:29092

  db:
    image: postgres:17.1
    restart: always
    shm_size: 128mb
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - 5432:5432
    volumes:
      - ./micro-services/db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  connect:
    image: quay.io/debezium/connect:3.1
    environment:
      BOOTSTRAP_SERVERS: broker:9092
      GROUP_ID: debezium-outbox
      HEAP_OPTS: "-Xms256m -Xmx512m"
      CONFIG_STORAGE_TOPIC: _connect-configs
      OFFSET_STORAGE_TOPIC: _connect-offsets
      STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      DEBEZIUM_DB_USER: ${DEBEZIUM_DB_USER:-postgres}
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      broker:
        condition: service_started
      db:
        condition: service_healthy

  connect-init:
    image: curlimages/curl:8.12.0
    volumes:
      - ./micro-services/debezium/connectors:/connectors:ro
      - ./micro-services/debezium/register.sh:/register.sh:ro
    entrypoint: ["sh", "/register.sh"]
    depends_on:
      connect:
        condition: service_healthy

  api-gateway:
    build: ./micro-services/api-gateway
    restart: unless-stopped
    ports:
      - 8080:8080
    environment:
      # Heap limitado: seis JVMs, Kafka e Connect precisam caber numa maquina de desenvolvimento.
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
      KAFKA_BOOTSTRAP: broker:9092
      REDIS_HOST: redis
      DB_URL: jdbc:postgresql://db:5432/user_db
      JWKS_URI: http://api-gateway:8080/.well-known/jwks.json
      GATEWAY_URL: http://api-gateway:8080
      USER_SERVICE_URL: http://user:8081
      INVENTORY_SERVICE_URL: http://inventory:8082
      ORDER_SERVICE_URL: http://order:8083
      PAYMENT_SERVICE_URL: http://payment:8084
      SHIPMENT_SERVICE_URL: http://shipment:8085
      USER_CLIENT_SECRET: ${USER_CLIENT_SECRET:-dev-user-secret}
      INVENTORY_CLIENT_SECRET: ${INVENTORY_CLIENT_SECRET:-dev-inventory-secret}
      ORDER_CLIENT_SECRET: ${ORDER_CLIENT_SECRET:-dev-order-secret}
      PAYMENT_CLIENT_SECRET: ${PAYMENT_CLIENT_SECRET:-dev-payment-secret}
      SHIPMENT_CLIENT_SECRET: ${SHIPMENT_CLIENT_SECRET:-dev-shipment-secret}
      STORE_OWNER_EMAIL: ${STORE_OWNER_EMAIL:-dono@loja.local}
      # Marcadores para a stack subir sem preparo nenhum. O login pelo Google so
      # funciona com credenciais de verdade; ate la a autorizacao e recusada la
      # mesmo, e o resto da loja roda normalmente.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-defina-no-google-cloud}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-defina-no-google-cloud}
      FRONT_URL: ${FRONT_URL:-http://localhost:3000}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-dev-webhook-secret}
    volumes:
      # Volume nomeado, nao bind: num clone novo a pasta nao existe no host, e um
      # bind somente leitura impediria o proprio container de gerar o par de
      # chaves. O volume herda dono e permissao da imagem e sobrevive ao recreate.
      # Para usar chaves de verdade, troque por um bind do seu diretorio.
      - gateway-keys:/app/keys
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_started
      redis:
        condition: service_healthy
      user:
        condition: service_started

  user:
    build: ./micro-services/user
    restart: unless-stopped
    environment:
      # Heap limitado: seis JVMs, Kafka e Connect precisam caber numa maquina de desenvolvimento.
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
      KAFKA_BOOTSTRAP: broker:9092
      REDIS_HOST: redis
      DB_URL: jdbc:postgresql://db:5432/user_db
      JWKS_URI: http://api-gateway:8080/.well-known/jwks.json
      GATEWAY_URL: http://api-gateway:8080
      SERVICE_CLIENT_SECRET: ${USER_CLIENT_SECRET:-dev-user-secret}
      STORE_OWNER_EMAIL: ${STORE_OWNER_EMAIL:-dono@loja.local}
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_started
      redis:
        condition: service_healthy

  inventory:
    build: ./micro-services/inventory
    restart: unless-stopped
    environment:
      # Heap limitado: seis JVMs, Kafka e Connect precisam caber numa maquina de desenvolvimento.
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
      KAFKA_BOOTSTRAP: broker:9092
      REDIS_HOST: redis
      DB_URL: jdbc:postgresql://db:5432/inventory_db
      JWKS_URI: http://api-gateway:8080/.well-known/jwks.json
      GATEWAY_URL: http://api-gateway:8080
      USER_SERVICE_URL: http://user:8081
      SERVICE_CLIENT_SECRET: ${INVENTORY_CLIENT_SECRET:-dev-inventory-secret}
      # Endereco interno: o SDK fala com o MinIO pela rede do compose.
      S3_ENDPOINT: http://minio:9000
      # Endereco publico: e com ele que a URL assinada e o link da foto sao
      # gerados, porque quem usa os dois e o navegador -- `minio` nao resolve la.
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-produtos}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  order:
    build: ./micro-services/order
    restart: unless-stopped
    environment:
      # Heap limitado: seis JVMs, Kafka e Connect precisam caber numa maquina de desenvolvimento.
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
      KAFKA_BOOTSTRAP: broker:9092
      REDIS_HOST: redis
      DB_URL: jdbc:postgresql://db:5432/order_db
      JWKS_URI: http://api-gateway:8080/.well-known/jwks.json
      GATEWAY_URL: http://api-gateway:8080
      USER_SERVICE_URL: http://user:8081
      INVENTORY_SERVICE_URL: http://inventory:8082
      SHIPMENT_SERVICE_URL: http://shipment:8085
      SERVICE_CLIENT_SECRET: ${ORDER_CLIENT_SECRET:-dev-order-secret}
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_started
      redis:
        condition: service_healthy

  payment:
    build: ./micro-services/payment
    restart: unless-stopped
    environment:
      # Heap limitado: seis JVMs, Kafka e Connect precisam caber numa maquina de desenvolvimento.
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
      KAFKA_BOOTSTRAP: broker:9092
      REDIS_HOST: redis
      DB_URL: jdbc:postgresql://db:5432/payment_db
      JWKS_URI: http://api-gateway:8080/.well-known/jwks.json
      GATEWAY_URL: http://api-gateway:8080
      ORDER_SERVICE_URL: http://order:8083
      SERVICE_CLIENT_SECRET: ${PAYMENT_CLIENT_SECRET:-dev-payment-secret}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_PUBLIC_KEY: ${MP_PUBLIC_KEY:-}
      MP_NOTIFICATION_URL: ${MP_NOTIFICATION_URL:-}
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_started
      redis:
        condition: service_healthy

  shipment:
    build: ./micro-services/shipment
    restart: unless-stopped
    environment:
      # Heap limitado: seis JVMs, Kafka e Connect precisam caber numa maquina de desenvolvimento.
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
      KAFKA_BOOTSTRAP: broker:9092
      REDIS_HOST: redis
      DB_URL: jdbc:postgresql://db:5432/shipment_db
      JWKS_URI: http://api-gateway:8080/.well-known/jwks.json
      GATEWAY_URL: http://api-gateway:8080
      USER_SERVICE_URL: http://user:8081
      ORDER_SERVICE_URL: http://order:8083
      SERVICE_CLIENT_SECRET: ${SHIPMENT_CLIENT_SECRET:-dev-shipment-secret}
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_started
      redis:
        condition: service_healthy

  # Armazenamento de objetos compativel com S3. As fotos de produto sao binario:
  # guardar no Postgres incharia o banco e o backup, e servir por microsservico
  # gastaria JVM para entregar arquivo estatico.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      # 9000 e a API S3 (o navegador baixa a foto daqui); 9001 e o console.
      - 9000:9000
      - 9001:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Cria o bucket e libera leitura anonima nele: foto de vitrine e publica, e
  # assinar cada <img> so somaria latencia e cache quebrado.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set loja http://minio:9000 "${S3_ACCESS_KEY:-minioadmin}" "${S3_SECRET_KEY:-minioadmin}"
        mc mb --ignore-existing loja/${S3_BUCKET:-produtos}
        mc anonymous set download loja/${S3_BUCKET:-produtos}
        # Arquivo enviado antes do produto existir fica em rascunho/ e e promovido
        # para a pasta do produto ao salvar. O que ficou para tras (formulario
        # abandonado) expira sozinho, em vez de virar lixo permanente no bucket.
        mc ilm rule add --expire-days 1 --prefix "rascunho/" loja/${S3_BUCKET:-produtos} 2>/dev/null || true
        echo "bucket pronto"

  # A vitrine: servidor Next em modo standalone. A parte publica sai renderizada
  # do servidor; o que depende de sessao roda no navegador.
  front:
    restart: unless-stopped
    build:
      context: ./front
      args:
        # Inlinado no bundle: e o endereco que o NAVEGADOR usa.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - 3000:3000
    environment:
      # Lido em execucao: e o endereco que o servidor do Next usa, dentro da rede.
      INTERNAL_API_URL: http://api-gateway:8080
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    depends_on:
      - api-gateway

volumes:
  pgdata:
  minio-data:
  gateway-keys:
