spring.application.name=user
server.port=8081
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/user_db}
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate

# --- Validacao de token ---
# Busca a chave publica no gateway. A busca acontece no primeiro token que
# chegar, nao no boot: este servico sobe normalmente com o gateway fora do ar.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWKS_URI:http://localhost:8080/.well-known/jwks.json}
# So aceita token emitido PARA a rede interna. O token que vive no browser sai
# com aud=front e e recusado aqui, mesmo sendo assinado pela mesma chave.
spring.security.oauth2.resourceserver.jwt.audiences=internal

# --- Kafka ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:29092}
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# --- Loja ---
# E-mail da conta Google do dono da loja. Essa conta vira o owner no primeiro
# login (ou no boot, se ja existir). Obrigatorio: sem dono ninguem opera a loja,
# entao o servico nao sobe sem isto.
app.store.owner-email=${STORE_OWNER_EMAIL}

# --- Armazenamento da foto de perfil ---
# O CDN do Google recusa a imagem pedida de outro dominio e troca a URL com o
# tempo: guardamos uma copia no nosso bucket. `public-url` e o endereco que o
# navegador usa, e `endpoint` o que este servico usa dentro da rede do compose.
app.s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
app.s3.public-url=${S3_PUBLIC_URL:http://localhost:9000}
app.s3.bucket=${S3_BUCKET:produtos}
app.s3.access-key=${S3_ACCESS_KEY:minioadmin}
app.s3.secret-key=${S3_SECRET_KEY:minioadmin}
