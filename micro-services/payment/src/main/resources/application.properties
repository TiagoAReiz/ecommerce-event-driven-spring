spring.application.name=payment
server.port=8084
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate

# --- Validacao de token ---
# Busca a chave publica no gateway. A busca acontece no primeiro token que
# chegar, nao no boot: este servico sobe normalmente com o gateway fora do ar.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWKS_URI:http://localhost:8080/.well-known/jwks.json}
# So aceita token emitido PARA a rede interna. O token que vive no browser sai
# com aud=front e e recusado aqui, mesmo sendo assinado pela mesma chave.
spring.security.oauth2.resourceserver.jwt.audiences=internal

# --- Kafka ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:29092}
spring.kafka.consumer.group-id=payment
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=orderRefundRequested:ecommerce_event_driven.payment.modules.payment.application.dtos.OrderRefundRequestedEvent
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# --- Redis ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# --- Gateway ---
app.gateway.url=${GATEWAY_URL:http://localhost:8080}

# --- Servico ---
app.service-client.id=payment
app.service-client.secret=${SERVICE_CLIENT_SECRET:dev-payment-secret}

# --- Servicos downstream ---
app.services.order.url=${ORDER_SERVICE_URL:http://localhost:8083}

# --- Mercado Pago ---
app.mercadopago.access-token=${MP_ACCESS_TOKEN:}
app.mercadopago.public-key=${MP_PUBLIC_KEY:}
app.mercadopago.notification-url=${MP_NOTIFICATION_URL:}
app.mercadopago.base-url=https://api.mercadopago.com
