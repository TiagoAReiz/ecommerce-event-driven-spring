spring.application.name=shipment
server.port=8085
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shipment_db}
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate

# --- Validacao de token ---
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWKS_URI:http://localhost:8080/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.audiences=internal

# --- Kafka ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:29092}
spring.kafka.consumer.group-id=shipment
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=orderConfirmed:ecommerce_event_driven.shipment.modules.shipment.infra.inbound.messaging.dtos.OrderConfirmedEventDto,orderCancelled:ecommerce_event_driven.shipment.modules.shipment.infra.inbound.messaging.dtos.OrderCancelledEventDto
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# --- Redis ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379

# --- Frete ---
app.gateway.url=${GATEWAY_URL:http://localhost:8080}
app.service-client.id=shipment
app.service-client.secret=${SERVICE_CLIENT_SECRET:dev-shipment-secret}
app.services.user.url=${USER_SERVICE_URL:http://localhost:8081}
app.shipping.rate-per-km=1.00

# --- Origem da loja ---
app.store.origin.zipcode=07010000
app.store.origin.country=BR
app.store.origin.state=SP
app.store.origin.city=Guarulhos
app.store.origin.street=Rua Exemplo
app.store.origin.number=100
app.store.origin.latitude=-23.4628
app.store.origin.longitude=-46.5333
