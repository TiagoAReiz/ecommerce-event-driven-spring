services:

    db:
      image: postgres:17
      restart: always
      shm_size: 128mb
      environment:
        POSTGRES_PASSWORD: postgres
        POSTGRES_USER: postgres
        POSTGRES_DB: postgres
      ports:
        - 5432:5432
      volumes:
        # Roda apenas na primeira inicialização, com o datadir vazio.
        - ./db/init:/docker-entrypoint-initdb.d:ro
        - pgdata:/var/lib/postgresql/data

volumes:
    pgdata:
