spring.application.name=order
spring.datasource.url=jdbc:postgresql://localhost:5432/order_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate

# --- Kafka ---
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.producer.properties.spring.json.type.mapping=orderCreated:ecommerce_event_driven.order.modules.order.infra.outbound.messaging.events.OrderCreatedEvent,orderCancelled:ecommerce_event_driven.order.modules.order.infra.outbound.messaging.events.OrderCancelledEvent

spring.kafka.consumer.properties.spring.json.type.mapping=stockReserved:ecommerce_event_driven.order.modules.order.infra.inbound.messaging.events.StockReservedEvent,stockRejected:ecommerce_event_driven.order.modules.order.infra.inbound.messaging.events.StockRejectedEvent


# --- Validacao de token ---
# Busca a chave publica no gateway. A busca acontece no primeiro token que
# chegar, nao no boot: este servico sobe normalmente com o gateway fora do ar.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/.well-known/jwks.json
# So aceita token emitido PARA a rede interna. O token que vive no browser sai
# com aud=front e e recusado aqui, mesmo sendo assinado pela mesma chave.
spring.security.oauth2.resourceserver.jwt.audiences=internal
