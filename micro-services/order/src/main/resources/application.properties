spring.application.name=order
server.port=8083

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/order_db}
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate

# --- Kafka ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:29092}

spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties.spring.json.type.mapping=\
  stockReserved:ecommerce_event_driven.order.modules.order.infra.inbound.messaging.events.StockReservedEvent,\
  stockRejected:ecommerce_event_driven.order.modules.order.infra.inbound.messaging.events.StockRejectedEvent,\
  stockCommitted:ecommerce_event_driven.order.modules.order.infra.inbound.messaging.events.StockCommittedEvent,\
  stockCommitFailed:ecommerce_event_driven.order.modules.order.infra.inbound.messaging.events.StockCommitFailedEvent,\
  paymentApproved:ecommerce_event_driven.order.modules.order.infra.inbound.messaging.events.PaymentApprovedEvent,\
  paymentFailed:ecommerce_event_driven.order.modules.order.infra.inbound.messaging.events.PaymentFailedEvent,\
  paymentRefunded:ecommerce_event_driven.order.modules.order.infra.inbound.messaging.events.PaymentRefundedEvent,\
  shipmentStatusChanged:ecommerce_event_driven.order.modules.order.infra.inbound.messaging.events.ShipmentStatusChangedEvent,\
  userDeleted:ecommerce_event_driven.order.modules.cart.infra.inbound.messaging.events.UserDeletedEvent


# --- Redis ---
spring.data.redis.host=${REDIS_HOST:localhost}

# --- Validacao de token ---
# Busca a chave publica no gateway. A busca acontece no primeiro token que
# chegar, nao no boot: este servico sobe normalmente com o gateway fora do ar.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWKS_URI:http://localhost:8080/.well-known/jwks.json}
# So aceita token emitido PARA a rede interna. O token que vive no browser sai
# com aud=front e e recusado aqui, mesmo sendo assinado pela mesma chave.
spring.security.oauth2.resourceserver.jwt.audiences=internal

# --- Servico de Token ---
app.gateway.url=${GATEWAY_URL:http://localhost:8080}
app.service-client.id=order
app.service-client.secret=${SERVICE_CLIENT_SECRET:dev-order-secret}

# --- Servicos Downstream ---
app.services.user.url=${USER_SERVICE_URL:http://localhost:8081}
app.services.inventory.url=${INVENTORY_SERVICE_URL:http://localhost:8082}
app.services.shipment.url=${SHIPMENT_SERVICE_URL:http://localhost:8085}
