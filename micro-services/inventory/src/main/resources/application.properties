spring.application.name=inventory
server.port=8082

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inventory_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate

# --- Kafka ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:29092}

spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties.spring.json.type.mapping=\
  orderCreated:ecommerce_event_driven.inventory.modules.product.infra.inbound.messaging.events.OrderCreatedEvent,\
  orderCancelled:ecommerce_event_driven.inventory.modules.product.infra.inbound.messaging.events.OrderCancelledEvent,\
  orderPaid:ecommerce_event_driven.inventory.modules.product.infra.inbound.messaging.events.OrderPaidEvent,\
  orderDelivered:ecommerce_event_driven.inventory.modules.review.infra.inbound.messaging.events.OrderDeliveredEvent,\
  userDeleted:ecommerce_event_driven.inventory.modules.review.infra.inbound.messaging.events.UserDeletedEvent

# --- Producer - Apenas para DLT, eventos sao publicados pela outbox via Debezium ---

# --- Redis ---
spring.data.redis.host=${REDIS_HOST:localhost}

# --- Validacao de token ---
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWKS_URI:http://localhost:8080/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.audiences=internal

# --- Servico de usuario ---
app.gateway.url=${GATEWAY_URL:http://localhost:8080}
app.service-client.id=inventory
app.service-client.secret=${SERVICE_CLIENT_SECRET:dev-inventory-secret}
app.services.user.url=${USER_SERVICE_URL:http://localhost:8081}

# Producer usado so pela DLT: o evento vai como JSON, nao como String.
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
