spring.application.name=api-gateway
server.port=8080

# --- Login com o Google ---
# O redirect URI registrado no Google Console tem que apontar para o GATEWAY:
# http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope[0]=openid
spring.security.oauth2.client.registration.google.scope[1]=profile
spring.security.oauth2.client.registration.google.scope[2]=email

app.front-url=http://localhost:3000
app.user-microservice.url=http://localhost:8081

# --- JWT ---
# Par de chaves RS256. So o gateway tem a privada, entao so ele emite token.
# Os demais servicos validam pela publica exposta em /.well-known/jwks.json.
# Caminho relativo ao diretorio de trabalho do processo (a pasta do modulo).
app.jwt.private-key=file:keys/jwt-private.pem
app.jwt.public-key=file:keys/jwt-public.pem
app.jwt.issuer=http://localhost:8080
# Token do usuario, que vive no browser.
app.jwt.ttl=PT1H
# Token de servico do proprio gateway. Curto porque e usado na mesma
# requisicao em que foi emitido.
app.jwt.service-ttl=PT1M
