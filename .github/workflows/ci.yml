name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Um push novo cancela o anterior do mesmo branch: nada de fila de builds velhos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, user, inventory, order, payment, shipment]

    # Os testes sobem o contexto Spring, e o contexto abre o pool e roda o Flyway:
    # sem Postgres nao ha o que testar. Kafka nao entra porque o listener nao
    # bloqueia o boot -- ele fica em retry e o contexto sobe igual.
    services:
      postgres:
        image: postgres:17.1
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Um banco por servico, como no compose.
      DB_URL: jdbc:postgresql://localhost:5432/${{ matrix.service == 'api-gateway' && 'user' || matrix.service }}_db
      # Endereco morto de proposito: o teste nao depende de broker.
      KAFKA_BOOTSTRAP: localhost:59999
      REDIS_HOST: localhost
      GATEWAY_URL: http://localhost:8080
      JWKS_URI: http://localhost:8080/.well-known/jwks.json
      USER_SERVICE_URL: http://localhost:8081
      INVENTORY_SERVICE_URL: http://localhost:8082
      ORDER_SERVICE_URL: http://localhost:8083
      PAYMENT_SERVICE_URL: http://localhost:8084
      SHIPMENT_SERVICE_URL: http://localhost:8085
      # Sem este e-mail o user nao sobe: o dono da loja nasce da configuracao.
      STORE_OWNER_EMAIL: owner@loja.dev
      SERVICE_CLIENT_SECRET: ci-secret
      USER_CLIENT_SECRET: ci-secret
      INVENTORY_CLIENT_SECRET: ci-secret
      ORDER_CLIENT_SECRET: ci-secret
      PAYMENT_CLIENT_SECRET: ci-secret
      SHIPMENT_CLIENT_SECRET: ci-secret
      MP_WEBHOOK_SECRET: ci-webhook-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Criar os bancos
        run: |
          for db in user_db inventory_db order_db payment_db shipment_db; do
            psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE $db;"
          done

      - name: Gerar o par de chaves do gateway
        if: matrix.service == 'api-gateway'
        working-directory: micro-services/api-gateway
        # As chaves de assinatura nao sao versionadas; no CI valem chaves descartaveis.
        run: |
          mkdir -p keys
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out keys/jwt-private.pem
          openssl rsa -pubout -in keys/jwt-private.pem -out keys/jwt-public.pem

      - name: Build e testes
        working-directory: micro-services/${{ matrix.service }}
        run: ./mvnw -B -ntp verify

      - name: Relatorios de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.service }}
          path: micro-services/${{ matrix.service }}/target/surefire-reports/

  front:
    name: front
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Instalar dependencias
        working-directory: front
        run: npm ci

      # O build roda `tsc -b` antes do bundle: erro de tipo quebra o job aqui,
      # que e onde custa barato.
      - name: Build
        working-directory: front
        run: npm run build
